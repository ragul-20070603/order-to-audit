<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title or 'Order to audit' }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if user %}
<header>
  <a class="brand" href="{{ url_for('home') }}">Snack Factory</a>
  <nav>{% for label, ep in nav %}<a href="{{ url_for(ep) }}" class="{{ 'on' if request.endpoint == ep }}">{{ label }}</a>{% endfor %}</nav>
  <span class="who">{{ user['name'] }} <small>({{ user['role'] }})</small> <a href="{{ url_for('logout') }}">Log out</a></span>
</header>
{% endif %}
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
