{% extends "base.html" %}{% import "_m.html" as m with context %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <form method="post">{{ m.csrf() }}
    <label>Username <input name="username" autocomplete="username" autofocus required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
</div>
<div class="card narrow">
  <h2>Demo logins</h2>
  <table><tr><th>Role</th><th>Username</th><th>Password</th></tr>
  {% for u, n, p, r in users %}<tr><td>{{ r }}</td><td><code>{{ u }}</code></td><td><code>{{ p }}</code></td></tr>{% endfor %}</table>
</div>
{% endblock %}
